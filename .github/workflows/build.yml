name: 测试和构建 Ubuntu 安装包

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-requests python3-keyring python3-secretstorage xvfb dbus-x11
      - name: 核心测试
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: 界面冒烟测试
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/gui_smoke.py
      - name: 构建安装包
        run: /usr/bin/python3 packaging/build_deb.py
      - name: 检查安装包
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: 验证包内程序
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/package_smoke.py dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: dist/*.deb
          if-no-files-found: error
